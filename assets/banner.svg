<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#070a13" />
    </linearGradient>

    <!-- Flow Pipeline Gradients -->
    <linearGradient id="streamGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.2" />
      <stop offset="50%" stop-color="#3b82f6" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0.2" />
    </linearGradient>

    <linearGradient id="streamGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.2" />
      <stop offset="50%" stop-color="#06b6d4" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.2" />
    </linearGradient>

    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="pillGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="nodeGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    .bg-grid { stroke: #334155; stroke-opacity: 0.15; stroke-width: 1; }
    .stream-line { fill: none; stroke-width: 2.5; stroke-dasharray: 10 15; }
    .stream-1 { stroke: url(#streamGrad1); animation: dashFlow 12s linear infinite; }
    .stream-2 { stroke: url(#streamGrad2); stroke-dasharray: 8 12; animation: dashFlowReverse 16s linear infinite; }
    .dynamic-particle { filter: url(#glow); }
    .p-glow1 { fill: #38bdf8; animation: moveP1 7s ease-in-out infinite alternate; }
    .p-glow2 { fill: #818cf8; animation: moveP2 9s ease-in-out infinite alternate; }
    .p-glow3 { fill: #10b981; animation: moveP3 8s ease-in-out infinite alternate; }
    .node-pulse { animation: pulseRing 3s ease-in-out infinite; }
    
    @keyframes dashFlow {
      0% { stroke-dashoffset: 400; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes dashFlowReverse {
      0% { stroke-dashoffset: 0; }
      100% { stroke-dashoffset: 400; }
    }
    @keyframes moveP1 {
      0% { transform: translate(0px, 0px) scale(0.9); opacity: 0.4; }
      50% { transform: translate(50px, -20px) scale(1.3); opacity: 0.8; }
      100% { transform: translate(110px, 15px) scale(1); opacity: 0.5; }
    }
    @keyframes moveP2 {
      0% { transform: translate(0px, 0px) scale(1.1); opacity: 0.3; }
      50% { transform: translate(-45px, 25px) scale(0.85); opacity: 0.75; }
      100% { transform: translate(-90px, -15px) scale(1.2); opacity: 0.4; }
    }
    @keyframes moveP3 {
      0% { transform: translate(0px, 0px); opacity: 0.3; }
      100% { transform: translate(70px, -30px); opacity: 0.7; }
    }
    @keyframes pulseRing {
      0% { r: 5; opacity: 0.4; }
      50% { r: 9; opacity: 0.9; }
      100% { r: 5; opacity: 0.4; }
    }

    .main-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 800; font-size: 46px; fill: url(#titleGrad); letter-spacing: -0.5px; }
    .sub-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 500; font-size: 19px; fill: #94a3b8; letter-spacing: 0.3px; }
    .badge-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 600; font-size: 13px; fill: #cbd5e1; }
    .node-text { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 12px; fill: #64748b; font-weight: 600; }
  </style>

  <!-- Background Base -->
  <rect width="1200" height="360" rx="16" fill="url(#bgGrad)" />
  <rect width="1198" height="358" x="1" y="1" rx="15" fill="none" stroke="#1e293b" stroke-width="1.5" />

  <!-- Background Grid Lines -->
  <g class="bg-grid">
    <line x1="0" y1="60" x2="1200" y2="60" />
    <line x1="0" y1="120" x2="1200" y2="120" />
    <line x1="0" y1="180" x2="1200" y2="180" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="0" y1="300" x2="1200" y2="300" />
    <line x1="150" y1="0" x2="150" y2="360" />
    <line x1="300" y1="0" x2="300" y2="360" />
    <line x1="450" y1="0" x2="450" y2="360" />
    <line x1="600" y1="0" x2="600" y2="360" />
    <line x1="750" y1="0" x2="750" y2="360" />
    <line x1="900" y1="0" x2="900" y2="360" />
    <line x1="1050" y1="0" x2="1050" y2="360" />
  </g>

  <!-- Dynamic Ambient Glowing Orbs in Background -->
  <g>
    <circle cx="220" cy="90" r="130" fill="#0284c7" opacity="0.12" filter="url(#glow)" />
    <circle cx="980" cy="270" r="140" fill="#7c3aed" opacity="0.13" filter="url(#glow)" />
    <circle cx="600" cy="180" r="160" fill="#0d9488" opacity="0.08" filter="url(#glow)" />
  </g>

  <!-- Dynamic Stream Lines (Data Pipelines in Background) -->
  <path class="stream-line stream-1" d="M -50 70 Q 250 120 500 50 T 950 80 T 1250 60" />
  <path class="stream-line stream-2" d="M -50 300 Q 280 250 550 310 T 980 260 T 1250 290" />
  <path class="stream-line stream-1" d="M -50 180 C 200 240, 400 130, 600 180 C 800 230, 1000 130, 1250 180" opacity="0.3" />

  <!-- Dynamic Floating Glowing Particles in Background -->
  <circle class="dynamic-particle p-glow1" cx="180" cy="80" r="4.5" />
  <circle class="dynamic-particle p-glow2" cx="1020" cy="280" r="5" />
  <circle class="dynamic-particle p-glow3" cx="540" cy="60" r="4" />
  <circle class="dynamic-particle p-glow1" cx="820" cy="90" r="4" />
  <circle class="dynamic-particle p-glow2" cx="340" cy="290" r="4.5" />

  <!-- Animated Pipeline Step Nodes (Background/Flanks) -->
  <g opacity="0.85">
    <!-- Source Step Node -->
    <circle cx="110" cy="180" r="6" fill="#0ea5e9" filter="url(#nodeGlow)" />
    <circle class="node-pulse" cx="110" cy="180" r="6" fill="none" stroke="#38bdf8" stroke-width="2" />
    <text x="110" y="206" text-anchor="middle" class="node-text">EXTRACT</text>

    <!-- Transform Step Node -->
    <circle cx="600" cy="318" r="6" fill="#8b5cf6" filter="url(#nodeGlow)" />
    <circle class="node-pulse" cx="600" cy="318" r="6" fill="none" stroke="#a78bfa" stroke-width="2" />
    <text x="600" y="340" text-anchor="middle" class="node-text">TRANSFORM</text>

    <!-- Load Step Node -->
    <circle cx="1090" cy="180" r="6" fill="#10b981" filter="url(#nodeGlow)" />
    <circle class="node-pulse" cx="1090" cy="180" r="6" fill="none" stroke="#34d399" stroke-width="2" />
    <text x="1090" y="206" text-anchor="middle" class="node-text">LOAD</text>
  </g>

  <!-- FOREGROUND CONTENT: Header, Typography, Badges (Solid Foreground) -->
  <g id="foreground-content">
    <!-- Top Category Tag -->
    <g transform="translate(600, 68)">
      <rect x="-135" y="-14" width="270" height="28" rx="14" fill="#1e293b" stroke="#334155" stroke-width="1.2" />
      <circle cx="-112" cy="0" r="4" fill="#38bdf8" />
      <text x="5" y="4.5" text-anchor="middle" class="badge-text" fill="#38bdf8" font-size="12">MODERN DATA STACK &amp; ETL</text>
    </g>

    <!-- Main Title -->
    <text x="600" y="132" text-anchor="middle" class="main-title">
      Awesome Data Pipeline &amp; ETL
    </text>

    <!-- Subtitle -->
    <text x="600" y="172" text-anchor="middle" class="sub-title">
      Curated Landscape of Top SaaS Platforms &amp; Open-Source Data Integration Tools
    </text>

    <!-- Feature Pill Tags in Foreground -->
    <g transform="translate(600, 235)">
      <!-- Pill 1: Batch & Streaming -->
      <g transform="translate(-320, 0)">
        <rect x="-85" y="-17" width="170" height="34" rx="17" fill="url(#pillGrad)" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="1.2" />
        <text x="0" y="5" text-anchor="middle" class="badge-text">⚡ Real-Time &amp; CDC</text>
      </g>

      <!-- Pill 2: Connectors & ELT -->
      <g transform="translate(-105, 0)">
        <rect x="-90" y="-17" width="180" height="34" rx="17" fill="url(#pillGrad)" stroke="#818cf8" stroke-opacity="0.4" stroke-width="1.2" />
        <text x="0" y="5" text-anchor="middle" class="badge-text">🔄 700+ ELT Connectors</text>
      </g>

      <!-- Pill 3: Orchestration -->
      <g transform="translate(115, 0)">
        <rect x="-95" y="-17" width="190" height="34" rx="17" fill="url(#pillGrad)" stroke="#c084fc" stroke-opacity="0.4" stroke-width="1.2" />
        <text x="0" y="5" text-anchor="middle" class="badge-text">⚙️ DAG Orchestration</text>
      </g>

      <!-- Pill 4: Open Source -->
      <g transform="translate(325, 0)">
        <rect x="-80" y="-17" width="160" height="34" rx="17" fill="url(#pillGrad)" stroke="#34d399" stroke-opacity="0.4" stroke-width="1.2" />
        <text x="0" y="5" text-anchor="middle" class="badge-text">🌐 Open Source &amp; Self-Host</text>
      </g>
    </g>
  </g>
</svg>
